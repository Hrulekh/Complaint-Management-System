spring:
  application:
    name: complaint-management-system

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cms}
    username: ${DB_USER:cms_user}
    password: ${DB_PASSWORD:cms_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs

jwt:
  secret: ${JWT_SECRET:your-secret-key-change-in-production}
  expiration: 3600000

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,https://*.vercel.app}

upload:
  directory: ${UPLOAD_DIR:/app/uploads}
  max-file-size: 5242880
  allowed-types: image/png,image/jpeg,application/pdf

logging:
  level:
    root: INFO
    com.cms.complaints: DEBUG
spring:
  application:
    name: complaint-management-system
  datasource:
    url: jdbc:h2:mem:cms;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
  servlet:
    context-path: /api

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs

jwt:
  secret: ${JWT_SECRET:dev-secret-key-for-testing}
  expiration: 3600000

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost}

upload:
  directory: ${UPLOAD_DIR:/app/uploads}
  max-file-size: 5242880
  allowed-types: image/png,image/jpeg,application/pdf

logging:
  level:
    root: INFO
    com.cms.complaints: DEBUG
